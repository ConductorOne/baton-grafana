name: ci
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # 1) Spin up a Grafana container as a service
    services:
      grafana:
        image: grafana/grafana:latest
        ports:
          - 3000:3000
        env:
          GF_SECURITY_ADMIN_USER: admin
          GF_SECURITY_ADMIN_PASSWORD: admin
        options: >-
          --health-cmd="curl --fail http://localhost:3000/api/health || exit 1" --health-interval=5s --health-retries=10
    # 2) Environment variables
    env:
      BATON_LOG_LEVEL: debug
      BATON_HOSTNAME: http://localhost:3000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # (Optional) Wait for Grafana explicitly:
      - name: Wait for Grafana
        run: |
          echo "Waiting for Grafana to become healthy..."
          for i in {1..6}; do
            if curl -s http://localhost:3000/api/health | grep '"database":true' > /dev/null; then
              echo "Grafana is ready!"
              break
            fi
            sleep 5
          done
      - name: Create a second admin user
        run: |
          curl --fail-with-body -X POST http://admin:admin@localhost:3000/api/admin/users \
            -H "Content-Type: application/json" \
            -d '{"name":"testUser","email":"testUser@example.com","password":"testUser","orgId":1}'
      - name: Grant admin to testUser
        run: |
          curl --fail-with-body -X PUT http://admin:admin@localhost:3000/api/admin/users/2/permissions \
            -H "Content-Type: application/json" \
            -d '{"isGrafanaAdmin": true}'
      - name: Build baton-grafana
        run: go build -o baton-grafana ./cmd/baton-grafana
      - name: Test sync
        env:
          BATON_USERNAME: admin
          BATON_PASSWORD: admin
        uses: ConductorOne/github-workflows/actions/sync-test@v2
        with:
          connector: ./baton-grafana
          baton-entitlement: "org:1:Admin"
          baton-principal: "2"
          baton-principal-type: "user"
