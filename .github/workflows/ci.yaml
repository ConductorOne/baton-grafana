name: ci

on:
  pull_request:

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run linters
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=3m

  go-test:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        if: success()
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go tests
        run: (set -o pipefail && go test -v -covermode=count -json ./... | tee test.json)
      - name: annotate go tests
        if: always()
        uses: guyarb/golang-test-annotations@v0.5.1
        with:
          test-results: test.json

  test:
    runs-on: ubuntu-latest
    # 1) Spin up a Grafana container as a service
    services:
      grafana:
        image: grafana/grafana:latest
        ports:
          - 3000:3000
        env:
          GF_SECURITY_ADMIN_USER: admin
          GF_SECURITY_ADMIN_PASSWORD: admin
        options: >-
          --health-cmd="curl --fail http://localhost:3000/api/health || exit 1"
          --health-interval=5s
          --health-retries=10

    # 2) Environment variables
    env:
      BATON_LOG_LEVEL: debug
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # (Optional) Wait for Grafana explicitly:
      - name: Wait for Grafana
        run: |
          echo "Waiting for Grafana to become healthy..."
          for i in {1..6}; do
            if curl -s http://localhost:3000/api/health | grep '"database":true' > /dev/null; then
              echo "Grafana is ready!"
              break
            fi
            sleep 5
          done
      - name: Build baton-grafana
        run: go build -o baton-grafana ./cmd/baton-grafana
      - name: Test sync
        env:
          BATON_USERNAME: admin
          BATON_PASSWORD: admin
        uses: ConductorOne/github-workflows/actions/sync-test@v2
        with:
          connector: ./baton-grafana
          baton-entitlement: "org:1:Admin"
          baton-principal: "1"
          baton-principal-type: "user"
